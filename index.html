<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>520次心动 - 给可爱的段思妃</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            padding: 15px;
            position: relative;
        }

        .container {
            text-align: center;
            z-index: 100;
            position: relative;
            width: 100%;
            max-width: 900px;
        }

        .header {
            margin-bottom: 15px;
        }

        h1 {
            color: #ff3366;
            font-size: clamp(1.8rem, 5vw, 3rem);
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .subtitle {
            color: #ff6699;
            font-size: clamp(1.1rem, 3.5vw, 1.5rem);
            margin-bottom: 5px;
        }

        .photo-section {
            margin: 10px auto 15px;
            position: relative;
            width: min(320px, 85vw);
            height: min(320px, 85vw);
        }

        .profile-photo {
            width: min(240px, 70vw);
            height: min(240px, 70vw);
            border-radius: 50%;
            object-fit: cover;
            border: 6px solid #ff99cc;
            box-shadow: 0 12px 35px rgba(255, 51, 102, 0.4);
            background-color: #fff;
            position: relative;
            z-index: 5;
        }

        .photo-frame {
            position: absolute;
            top: min(-15px, -5vw);
            left: 50%;
            transform: translateX(-50%);
            width: min(280px, 78vw);
            height: min(280px, 78vw);
            border-radius: 50%;
            background: linear-gradient(45deg, #ff3366, #ff99cc, #ff3366);
            z-index: 1;
            animation: rotateFrame 10s linear infinite;
            opacity: 0.8;
        }

        @keyframes rotateFrame {
            0% { transform: translateX(-50%) rotate(0deg); }
            100% { transform: translateX(-50%) rotate(360deg); }
        }

        .start-btn {
            background: linear-gradient(to right, #ff3366, #ff6699);
            color: white;
            border: none;
            padding: clamp(14px, 4vw, 18px) clamp(30px, 8vw, 45px);
            font-size: clamp(1.1rem, 3.5vw, 1.4rem);
            border-radius: 50px;
            cursor: pointer;
            margin: 15px 0;
            box-shadow: 0 8px 20px rgba(255, 51, 102, 0.4);
            transition: all 0.3s ease;
            font-weight: bold;
            letter-spacing: 1px;
            width: 90%;
            max-width: 300px;
        }

        .start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(255, 51, 102, 0.5);
        }

        .start-btn:active {
            transform: translateY(-1px);
        }

        .message {
            color: #ff3366;
            font-size: clamp(1rem, 3vw, 1.3rem);
            margin-top: 12px;
            height: 24px;
            font-weight: bold;
            padding: 0 10px;
            min-height: 24px;
        }

        .blessing-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .blessing {
            position: absolute;
            padding: clamp(6px, 1.5vw, 10px) clamp(10px, 2.5vw, 16px);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(255, 240, 245, 0.95));
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(255, 51, 102, 0.3);
            font-size: clamp(0.85rem, 2.5vw, 1rem);
            color: #ff3366;
            font-weight: bold;
            text-align: center;
            max-width: min(180px, 45vw);
            border: 2px solid rgba(255, 153, 204, 0.6);
            pointer-events: none;
            z-index: 20;
            opacity: 0;
            animation: floatUp 2.5s ease-out forwards;
            transform-origin: center;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        @keyframes floatUp {
            0% {
                opacity: 0;
                transform: scale(0.5) translateY(0);
            }
            20% {
                opacity: 1;
                transform: scale(1) translateY(-10px);
            }
            80% {
                opacity: 1;
                transform: scale(1) translateY(-30px);
            }
            100% {
                opacity: 0;
                transform: scale(0.8) translateY(-60px);
            }
        }

        .progress-bar {
            width: 0%;
            height: 8px;
            background: linear-gradient(to right, #ff3366, #ff99cc);
            border-radius: 4px;
            margin: 12px auto;
            transition: width 0.5s ease;
            max-width: min(500px, 90vw);
        }

        .counter {
            color: #ff3366;
            font-size: clamp(1.1rem, 3.5vw, 1.5rem);
            font-weight: bold;
            margin: 8px 0;
        }

        .instructions {
            color: #ff6699;
            font-size: clamp(0.9rem, 2.8vw, 1.1rem);
            margin-top: 8px;
            line-height: 1.5;
            padding: 0 10px;
        }

        .footer {
            margin-top: 15px;
            color: #ff99cc;
            font-size: clamp(0.8rem, 2.5vw, 1rem);
            padding: 0 10px;
            line-height: 1.4;
        }

        @media (min-width: 768px) {
            .photo-section {
                width: 350px;
                height: 350px;
            }
            .profile-photo {
                width: 260px;
                height: 260px;
            }
            .photo-frame {
                width: 300px;
                height: 300px;
                top: -20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>温馨祝福 - 520次心动</h1>
            <div class="subtitle">送给可爱的段思妃</div>
        </div>

        <div class="photo-section">
            <div class="photo-frame"></div>
            <img src="https://love-for-dsf.github.io/love2.jpg" alt="段思妃的照片" class="profile-photo" id="profilePhoto">
        </div>

        <div class="instructions">
            点击"开始祝福"按钮，屏幕上会先形成三个爱心形状<br>
            然后弹出520个温馨祝福，每个祝福3秒后自动消失
        </div>

        <button class="start-btn" id="startBtn">开始祝福</button>

        <div class="counter" id="counter">已发送: 0 / 520</div>
        <div class="progress-bar" id="progressBar"></div>
        <div class="message" id="message">点击上方按钮开始发送520次心动祝福</div>

        <div class="footer">
            段思妃要天天开心 · 只为生活快乐 · 你为什么这么吸引我眼球 · 520次心动发送中...
        </div>
    </div>

    <div class="blessing-container" id="blessingContainer"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const startBtn = document.getElementById('startBtn');
            const blessingContainer = document.getElementById('blessingContainer');
            const counter = document.getElementById('counter');
            const progressBar = document.getElementById('progressBar');
            const message = document.getElementById('message');

            const blessings = [
                "段思妃要天天开心", "只为生活快乐", "你为什么这么吸引我眼球",
                "愿你笑容灿烂如花", "每一天都充满阳光", "心想事成万事如意",
                "幸福永驻你身边", "好运常伴你左右", "美丽与智慧并存",
                "健康快乐每一天", "爱情甜蜜美满", "事业顺利成功",
                "青春永驻容颜", "梦想都能实现", "生活充满惊喜",
                "永远被爱包围", "每一天都精彩", "心中充满喜悦",
                "未来更加美好", "你是最可爱的", "世界因你更美",
                "快乐永不褪色", "幸运之星常伴", "微笑永远甜美",
                "生活甜如蜜糖", "心中永存温暖", "美好如期而至",
                "每天都有好心情", "永远年轻美丽", "一切顺心如意"
            ];

            // 生成爱心坐标（爱心尺寸稍微调小）
            function generateHeartPoints(count, offsetX = 0, offsetY = 0, sizeFactor = 0.85) {
                const points = [];
                const centerX = window.innerWidth / 2 + offsetX;
                const centerY = window.innerHeight / 2 + offsetY;
                const screenSize = Math.min(window.innerWidth, window.innerHeight);
                let size = screenSize * 0.32 * sizeFactor;  // 从0.38降到0.32，爱心稍小更精致
                
                for (let i = 0; i < count; i++) {
                    const t = (i / count) * 2 * Math.PI;
                    const x = 16 * Math.pow(Math.sin(t), 3);
                    const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                    const scaledX = centerX + x * size / 16;
                    const scaledY = centerY - y * size / 16;
                    const safeX = Math.max(20, Math.min(window.innerWidth - 80, scaledX));
                    const safeY = Math.max(20, Math.min(window.innerHeight - 80, scaledY));
                    points.push({x: safeX, y: safeY});
                }
                return points;
            }

            function getHeartPoints() {
                const screenWidth = window.innerWidth;
                const screenHeight = window.innerHeight;
                let offsets = [];
                if (screenWidth < 400) {
                    offsets = [
                        {x: -screenWidth * 0.22, y: -screenHeight * 0.18},
                        {x: 0, y: -screenHeight * 0.05},
                        {x: screenWidth * 0.22, y: -screenHeight * 0.18}
                    ];
                } else if (screenWidth < 768) {
                    offsets = [
                        {x: -screenWidth * 0.2, y: -screenHeight * 0.16},
                        {x: 0, y: -screenHeight * 0.05},
                        {x: screenWidth * 0.2, y: -screenHeight * 0.16}
                    ];
                } else {
                    offsets = [
                        {x: -140, y: -100},
                        {x: 0, y: -30},
                        {x: 140, y: -100}
                    ];
                }
                return offsets.map(off => generateHeartPoints(99, off.x, off.y, 0.85));
            }

            let heartPointsSets = getHeartPoints();
            let totalRandom = 520;
            let blessingsSent = 0;
            let isActive = false;
            let heartsCompleted = [false, false, false];
            let heartsSent = [0, 0, 0];

            function createBlessing(x, y, text, heartType = -1) {
                const blessing = document.createElement('div');
                blessing.className = 'blessing';
                blessing.textContent = text;
                blessing.style.left = `${x}px`;
                blessing.style.top = `${y}px`;
                const hue = 330 + Math.random() * 30;
                const saturation = 70 + Math.random() * 20;
                const lightness = 50 + Math.random() * 20;
                blessing.style.color = `hsl(${hue}, ${saturation}%, ${lightness}%)`;
                const scale = 0.9 + Math.random() * 0.2;
                blessing.style.transform = `scale(${scale})`;
                const duration = 2 + Math.random() * 1;
                blessing.style.animationDuration = `${duration}s`;
                
                if (heartType === 0) {
                    blessing.style.background = 'linear-gradient(135deg, rgba(255, 230, 240, 0.95), rgba(255, 200, 220, 0.95))';
                    blessing.style.boxShadow = '0 6px 20px rgba(255, 51, 102, 0.5)';
                    blessing.style.border = '2px solid rgba(255, 102, 153, 0.8)';
                } else if (heartType === 1) {
                    blessing.style.background = 'linear-gradient(135deg, rgba(255, 220, 230, 0.95), rgba(255, 180, 200, 0.95))';
                    blessing.style.boxShadow = '0 6px 20px rgba(255, 0, 85, 0.5)';
                    blessing.style.border = '2px solid rgba(255, 51, 102, 0.8)';
                    blessing.style.color = '#ff004d';
                } else if (heartType === 2) {
                    blessing.style.background = 'linear-gradient(135deg, rgba(255, 240, 245, 0.95), rgba(255, 210, 230, 0.95))';
                    blessing.style.boxShadow = '0 6px 20px rgba(255, 80, 120, 0.5)';
                    blessing.style.border = '2px solid rgba(255, 80, 120, 0.8)';
                }
                
                blessingContainer.appendChild(blessing);
                setTimeout(() => { if(blessing.parentNode) blessing.parentNode.removeChild(blessing); }, 2500);
                return blessing;
            }

            function sendHeartBlessings(index) {
                if (heartsSent[index] >= heartPointsSets[index].length) {
                    heartsCompleted[index] = true;
                    if (index === 0) message.textContent = "第一个爱心完成！";
                    else if (index === 1) message.textContent = "第二个爱心完成！";
                    else message.textContent = "第三个爱心完成！开始发送随机祝福...";
                    return;
                }
                const point = heartPointsSets[index][heartsSent[index]];
                const text = blessings[Math.floor(Math.random() * blessings.length)];
                createBlessing(point.x, point.y, text, index);
                heartsSent[index]++;
                const speed = window.innerWidth < 768 ? 45 : 35;
                if (heartsSent[index] < heartPointsSets[index].length) {
                    setTimeout(() => sendHeartBlessings(index), speed);
                } else {
                    heartsCompleted[index] = true;
                    if (index === 0) message.textContent = "第一个爱心完成！";
                    else if (index === 1) message.textContent = "第二个爱心完成！";
                    else message.textContent = "第三个爱心完成！开始发送随机祝福...";
                }
            }

            // 随机祝福不规避任何位置
            function sendRandomBlessing() {
                if (blessingsSent >= totalRandom) {
                    message.textContent = "520次心动祝福发送完成！";
                    isActive = false;
                    startBtn.textContent = "祝福完成";
                    startBtn.disabled = false;
                    return;
                }
                
                let x = Math.random() * (window.innerWidth - 100);
                let y = Math.random() * (window.innerHeight - 80);
                
                const text = blessings[Math.floor(Math.random() * blessings.length)];
                createBlessing(x, y, text, -1);
                blessingsSent++;
                updateProgress();
                
                const delay = 35;
                if (blessingsSent < totalRandom) {
                    setTimeout(sendRandomBlessing, delay);
                } else {
                    message.textContent = "520次心动祝福发送完成！";
                    isActive = false;
                    startBtn.textContent = "祝福完成";
                    startBtn.disabled = false;
                    setTimeout(() => {
                        message.textContent = "段思妃，三个爱心送给你，你是我永远的心动！";
                    }, 3000);
                }
            }

            function updateProgress() {
                counter.textContent = `已发送: ${blessingsSent} / ${totalRandom}`;
                const progress = (blessingsSent / totalRandom) * 100;
                progressBar.style.width = `${progress}%`;
                if (blessingsSent < totalRandom) {
                    const percent = Math.floor((blessingsSent / totalRandom) * 100);
                    message.textContent = `随机祝福发送中...${percent}%`;
                }
            }

            function startBlessings() {
                if (isActive) return;
                isActive = true;
                blessingsSent = 0;
                heartsSent = [0, 0, 0];
                heartsCompleted = [false, false, false];
                heartPointsSets = getHeartPoints();
                blessingContainer.innerHTML = '';
                startBtn.textContent = "祝福发送中...";
                startBtn.disabled = true;
                message.textContent = "开始形成三个爱心...";
                
                setTimeout(() => {
                    sendHeartBlessings(0);
                    setTimeout(() => {
                        const checkInterval = setInterval(() => {
                            if (heartsCompleted[0]) {
                                clearInterval(checkInterval);
                                sendHeartBlessings(1);
                                setTimeout(() => {
                                    const checkInterval2 = setInterval(() => {
                                        if (heartsCompleted[1]) {
                                            clearInterval(checkInterval2);
                                            sendHeartBlessings(2);
                                            setTimeout(() => {
                                                const checkInterval3 = setInterval(() => {
                                                    if (heartsCompleted[2]) {
                                                        clearInterval(checkInterval3);
                                                        message.textContent = "爱心完成！开始随机祝福...";
                                                        sendRandomBlessing();
                                                    }
                                                }, 100);
                                            }, 100);
                                        }
                                    }, 100);
                                }, 100);
                            }
                        }, 100);
                    }, 100);
                }, 100);
            }

            startBtn.addEventListener('click', startBlessings);
            window.addEventListener('resize', () => { heartPointsSets = getHeartPoints(); });
            
            const profilePhoto = document.getElementById('profilePhoto');
            profilePhoto.onerror = function() {
                this.src = 'https://via.placeholder.com/240x240/ff99cc/ffffff?text=可爱的段思妃';
            };
        });
    </script>
</body>
</html>
