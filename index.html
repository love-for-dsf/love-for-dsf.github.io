<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>520次心动 - 给可爱的段思妃</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            padding: 20px;
            position: relative;
        }

        .container {
            text-align: center;
            z-index: 100;
            position: relative;
            width: 100%;
            max-width: 900px;
        }

        .header {
            margin-bottom: 20px;
        }

        h1 {
            color: #ff3366;
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .subtitle {
            color: #ff6699;
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .photo-section {
            margin: 10px auto 20px;
            position: relative;
            width: 400px;
            height: 400px;
        }

        .profile-photo {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            object-fit: cover;
            border: 8px solid #ff99cc;
            box-shadow: 0 15px 40px rgba(255, 51, 102, 0.5);
            margin-bottom: 25px;
            background-color: #fff;
            position: relative;
            z-index: 5;
        }

        .photo-frame {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff3366, #ff99cc, #ff3366);
            z-index: 1;
            animation: rotateFrame 10s linear infinite;
            opacity: 0.8;
        }

        @keyframes rotateFrame {
            0% { transform: translateX(-50%) rotate(0deg); }
            100% { transform: translateX(-50%) rotate(360deg); }
        }

        .start-btn {
            background: linear-gradient(to right, #ff3366, #ff6699);
            color: white;
            border: none;
            padding: 18px 45px;
            font-size: 1.4rem;
            border-radius: 50px;
            cursor: pointer;
            margin: 20px 0;
            box-shadow: 0 10px 25px rgba(255, 51, 102, 0.5);
            transition: all 0.3s ease;
            font-weight: bold;
            letter-spacing: 1.5px;
        }

        .start-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(255, 51, 102, 0.6);
        }

        .start-btn:active {
            transform: translateY(-2px);
        }

        .message {
            color: #ff3366;
            font-size: 1.3rem;
            margin-top: 15px;
            height: 28px;
            font-weight: bold;
        }

        .blessing-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .blessing {
            position: absolute;
            padding: 12px 20px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(255, 240, 245, 0.95));
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(255, 51, 102, 0.3);
            font-size: 1.1rem;
            color: #ff3366;
            font-weight: bold;
            text-align: center;
            max-width: 220px;
            border: 2px solid rgba(255, 153, 204, 0.6);
            pointer-events: none;
            z-index: 20;
            opacity: 0;
            animation: floatUp 2.5s ease-out forwards;
            transform-origin: center;
        }

        @keyframes floatUp {
            0% {
                opacity: 0;
                transform: scale(0.5) translateY(0);
            }
            20% {
                opacity: 1;
                transform: scale(1) translateY(-10px);
            }
            80% {
                opacity: 1;
                transform: scale(1) translateY(-30px);
            }
            100% {
                opacity: 0;
                transform: scale(0.8) translateY(-60px);
            }
        }

        .heart-shape {
            position: absolute;
            width: 2px;
            height: 2px;
            background-color: #ff3366;
            border-radius: 50%;
            opacity: 0.7;
            z-index: 5;
        }

        .progress-bar {
            width: 0%;
            height: 10px;
            background: linear-gradient(to right, #ff3366, #ff99cc);
            border-radius: 5px;
            margin: 15px auto;
            transition: width 0.5s ease;
            max-width: 600px;
        }

        .counter {
            color: #ff3366;
            font-size: 1.5rem;
            font-weight: bold;
            margin: 10px 0;
        }

        .instructions {
            color: #ff6699;
            font-size: 1.1rem;
            margin-top: 10px;
            max-width: 700px;
            line-height: 1.6;
        }

        .footer {
            margin-top: 20px;
            color: #ff99cc;
            font-size: 1rem;
        }

        .heart-indicator {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 15px 0;
        }

        .heart-step {
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 20px;
            color: #ff3366;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .heart-step.active {
            background: #ff3366;
            color: white;
            transform: scale(1.1);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.3rem;
            }

            .subtitle {
                font-size: 1.2rem;
            }

            .photo-section {
                width: 320px;
                height: 320px;
            }

            .profile-photo {
                width: 220px;
                height: 220px;
            }

            .photo-frame {
                width: 260px;
                height: 260px;
                top: -20px;
            }

            .blessing {
                font-size: 1rem;
                max-width: 180px;
                padding: 10px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>温馨祝福 - 520次心动</h1>
            <div class="subtitle">送给可爱的段思妃</div>
        </div>

        <div class="photo-section">
            <div class="photo-frame"></div>
            <img src="https://love-for-dsf.github.io/love2.jpg" alt="段思妃的照片" class="profile-photo">
        </div>

        <div class="instructions">
            点击"开始祝福"按钮，屏幕上会先形成两个爱心形状，然后弹出520个温馨祝福窗口<br>
            每个祝福都会随机出现在屏幕的不同位置，3秒后自动消失
        </div>

        <div class="heart-indicator">
            <div class="heart-step" id="heart1">第一个爱心</div>
            <div class="heart-step" id="heart2">第二个爱心</div>
            <div class="heart-step" id="heart3">随机祝福</div>
        </div>

        <button class="start-btn" id="startBtn">开始祝福</button>

        <div class="counter" id="counter">已发送: 0 / 520</div>
        <div class="progress-bar" id="progressBar"></div>
        <div class="message" id="message"></div>

        <div class="footer">
            段思妃要天天开心 · 只为生活快乐 · 你为什么这么吸引我眼球 · 520次心动发送中...
        </div>
    </div>

    <div class="blessing-container" id="blessingContainer"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const startBtn = document.getElementById('startBtn');
            const blessingContainer = document.getElementById('blessingContainer');
            const counter = document.getElementById('counter');
            const progressBar = document.getElementById('progressBar');
            const message = document.getElementById('message');
            const heart1Indicator = document.getElementById('heart1');
            const heart2Indicator = document.getElementById('heart2');
            const heart3Indicator = document.getElementById('heart3');

            // 祝福语库
            const blessings = [
                "段思妃要天天开心",
                "只为生活快乐",
                "你为什么这么吸引我眼球",
                "愿你笑容灿烂如花",
                "每一天都充满阳光",
                "心想事成万事如意",
                "幸福永驻你身边",
                "好运常伴你左右",
                "美丽与智慧并存",
                "健康快乐每一天",
                "爱情甜蜜美满",
                "事业顺利成功",
                "青春永驻容颜",
                "梦想都能实现",
                "生活充满惊喜",
                "永远被爱包围",
                "每一天都精彩",
                "心中充满喜悦",
                "未来更加美好",
                "你是最可爱的",
                "世界因你更美",
                "快乐永不褪色",
                "幸运之星常伴",
                "微笑永远甜美",
                "生活甜如蜜糖",
                "心中永存温暖",
                "美好如期而至",
                "每天都有好心情",
                "永远年轻美丽",
                "一切顺心如意",
                "可爱的你值得所有美好",
                "天真烂漫的笑容",
                "温柔可爱的你",
                "迷人的可爱女孩",
                "可爱到让人心动",
                "天生可爱的气质",
                "可爱魅力无法挡",
                "最可爱的存在",
                "可爱满分每一天",
                "双倍爱心送给你",
                "一心一意只为你",
                "两颗心永远相连",
                "爱你千千万万遍",
                "你是我心中的唯一",
                "比心比心再比心",
                "双份快乐送给你",
                "双重祝福伴随你",
                "两心相悦永相伴",
                "双倍的幸福快乐"
            ];

            // 生成爱心形状的坐标点
            function generateHeartPoints(count, offsetX = 0, offsetY = 0, sizeFactor = 1) {
                const points = [];
                const centerX = window.innerWidth / 2 + offsetX;
                const centerY = window.innerHeight / 2 + offsetY;
                const size = Math.min(window.innerWidth, window.innerHeight) * 0.3 * sizeFactor;

                for (let i = 0; i < count; i++) {
                    const t = (i / count) * 2 * Math.PI;
                    // 心形曲线参数方程
                    const x = 16 * Math.pow(Math.sin(t), 3);
                    const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);

                    // 缩放并定位
                    const scaledX = centerX + x * size / 16;
                    const scaledY = centerY - y * size / 16;

                    points.push({x: scaledX, y: scaledY});
                }

                return points;
            }

            // 生成两个爱心的坐标点（每个99个点）
            const heart1Points = generateHeartPoints(99, -120, -80, 0.9);
            const heart2Points = generateHeartPoints(99, 120, 80, 0.9);

            let totalBlessings = 520;
            let blessingsSent = 0;
            let isActive = false;
            let heart1Completed = false;
            let heart2Completed = false;
            let heart1BlessingsSent = 0;
            let heart2BlessingsSent = 0;

            // 更新指示器状态
            function updateIndicators() {
                if (!heart1Completed) {
                    heart1Indicator.classList.add('active');
                    heart2Indicator.classList.remove('active');
                    heart3Indicator.classList.remove('active');
                } else if (!heart2Completed) {
                    heart1Indicator.classList.remove('active');
                    heart2Indicator.classList.add('active');
                    heart3Indicator.classList.remove('active');
                } else {
                    heart1Indicator.classList.remove('active');
                    heart2Indicator.classList.remove('active');
                    heart3Indicator.classList.add('active');
                }
            }

            // 创建单个祝福弹窗
            function createBlessing(x, y, text, heartType = 0) {
                const blessing = document.createElement('div');
                blessing.className = 'blessing';
                blessing.textContent = text;

                // 设置位置
                blessing.style.left = `${x}px`;
                blessing.style.top = `${y}px`;

                // 随机颜色深浅
                const hue = 330 + Math.random() * 30; // 红色到粉色范围
                const saturation = 70 + Math.random() * 20;
                const lightness = 50 + Math.random() * 20;
                blessing.style.color = `hsl(${hue}, ${saturation}%, ${lightness}%)`;

                // 随机大小微调
                const scale = 0.9 + Math.random() * 0.2;
                blessing.style.transform = `scale(${scale})`;

                // 随机动画时长
                const duration = 2 + Math.random() * 1;
                blessing.style.animationDuration = `${duration}s`;

                // 根据爱心类型添加特殊效果
                if (heartType === 1) {
                    // 第一个爱心 - 粉色系
                    blessing.style.background = 'linear-gradient(135deg, rgba(255, 230, 240, 0.95), rgba(255, 200, 220, 0.95))';
                    blessing.style.boxShadow = '0 8px 25px rgba(255, 51, 102, 0.5)';
                    blessing.style.border = '2px solid rgba(255, 102, 153, 0.8)';
                    blessing.style.fontSize = '1.2rem';
                    blessing.style.zIndex = '25';
                } else if (heartType === 2) {
                    // 第二个爱心 - 红色系
                    blessing.style.background = 'linear-gradient(135deg, rgba(255, 220, 230, 0.95), rgba(255, 180, 200, 0.95))';
                    blessing.style.boxShadow = '0 8px 25px rgba(255, 0, 85, 0.5)';
                    blessing.style.border = '2px solid rgba(255, 51, 102, 0.8)';
                    blessing.style.fontSize = '1.2rem';
                    blessing.style.zIndex = '26';
                    blessing.style.color = '#ff004d';
                }

                blessingContainer.appendChild(blessing);

                // 3秒后移除
                setTimeout(() => {
                    if (blessing.parentNode) {
                        blessing.parentNode.removeChild(blessing);
                    }
                }, 2500);

                return blessing;
            }

            // 发送第一个爱心形状的祝福
            function sendHeart1Blessings() {
                if (heart1BlessingsSent >= heart1Points.length) {
                    heart1Completed = true;
                    updateIndicators();
                    message.textContent = "第一个爱心完成！开始形成第二个爱心...";
                    return;
                }

                const point = heart1Points[heart1BlessingsSent];
                const text = blessings[Math.floor(Math.random() * blessings.length)];

                createBlessing(point.x, point.y, text, 1);

                heart1BlessingsSent++;
                blessingsSent++;

                updateProgress();

                // 第一个爱心快速发送，每40毫秒一个
                if (heart1BlessingsSent < heart1Points.length) {
                    setTimeout(sendHeart1Blessings, 40);
                } else {
                    heart1Completed = true;
                    updateIndicators();
                    message.textContent = "第一个爱心完成！开始形成第二个爱心...";
                }
            }

            // 发送第二个爱心形状的祝福
            function sendHeart2Blessings() {
                if (heart2BlessingsSent >= heart2Points.length) {
                    heart2Completed = true;
                    updateIndicators();
                    message.textContent = "第二个爱心完成！开始发送随机祝福...";
                    return;
                }

                const point = heart2Points[heart2BlessingsSent];
                const text = blessings[Math.floor(Math.random() * blessings.length)];

                createBlessing(point.x, point.y, text, 2);

                heart2BlessingsSent++;
                blessingsSent++;

                updateProgress();

                // 第二个爱心快速发送，每40毫秒一个
                if (heart2BlessingsSent < heart2Points.length) {
                    setTimeout(sendHeart2Blessings, 40);
                } else {
                    heart2Completed = true;
                    updateIndicators();
                    message.textContent = "第二个爱心完成！开始发送随机祝福...";
                }
            }

            // 发送随机位置的祝福
            function sendRandomBlessing() {
                if (blessingsSent >= totalBlessings) {
                    message.textContent = "520次心动祝福发送完成！";
                    isActive = false;
                    startBtn.textContent = "祝福完成";
                    startBtn.disabled = false;
                    heart3Indicator.classList.remove('active');
                    return;
                }

                // 随机位置，确保不遮挡人脸区域
                const safeZone = {
                    x: window.innerWidth / 2 - 180,
                    y: window.innerHeight / 2 - 180,
                    width: 360,
                    height: 360
                };

                let x, y;
                let attempts = 0;

                do {
                    x = Math.random() * (window.innerWidth - 200);
                    y = Math.random() * (window.innerHeight - 100);
                    attempts++;
                } while (
                    x > safeZone.x &&
                    x < safeZone.x + safeZone.width &&
                    y > safeZone.y &&
                    y < safeZone.y + safeZone.height &&
                    attempts < 20
                );

                const text = blessings[Math.floor(Math.random() * blessings.length)];
                createBlessing(x, y, text, 0);

                blessingsSent++;
                updateProgress();

                // 随机祝福阶段每80毫秒弹出一个
                const delay = 80;

                if (blessingsSent < totalBlessings) {
                    setTimeout(sendRandomBlessing, delay);
                } else {
                    message.textContent = "520次心动祝福发送完成！";
                    isActive = false;
                    startBtn.textContent = "祝福完成";
                    startBtn.disabled = false;
                    heart3Indicator.classList.remove('active');

                    // 完成后显示特别消息
                    setTimeout(() => {
                        message.textContent = "段思妃，双倍爱心送给你，你是我永远的心动！";
                    }, 3000);
                }
            }

            // 更新进度显示
            function updateProgress() {
                counter.textContent = `已发送: ${blessingsSent} / ${totalBlessings}`;
                const progress = (blessingsSent / totalBlessings) * 100;
                progressBar.style.width = `${progress}%`;

                // 更新消息
                if (blessingsSent < 99) {
                    message.textContent = `正在形成第一个爱心... ${heart1BlessingsSent}/99`;
                } else if (blessingsSent < 198) {
                    message.textContent = `正在形成第二个爱心... ${heart2BlessingsSent}/99`;
                } else if (blessingsSent < totalBlessings) {
                    const percent = Math.floor((blessingsSent / totalBlessings) * 100);
                    message.textContent = `随机祝福发送中... ${percent}%`;
                }
            }

            // 开始祝福
            function startBlessings() {
                if (isActive) return;

                isActive = true;
                blessingsSent = 0;
                heart1BlessingsSent = 0;
                heart2BlessingsSent = 0;
                heart1Completed = false;
                heart2Completed = false;

                // 清空现有祝福
                blessingContainer.innerHTML = '';

                startBtn.textContent = "祝福发送中...";
                startBtn.disabled = true;

                message.textContent = "开始发送520次心动祝福...";
                updateIndicators();

                // 先发送第一个爱心形状的99个祝福
                setTimeout(() => {
                    sendHeart1Blessings();

                    // 第一个爱心形成后开始发送第二个爱心
                    setTimeout(() => {
                        if (!heart1Completed) {
                            const checkHeart1 = setInterval(() => {
                                if (heart1Completed) {
                                    clearInterval(checkHeart1);
                                    sendHeart2Blessings();

                                    // 第二个爱心形成后开始发送随机祝福
                                    setTimeout(() => {
                                        if (!heart2Completed) {
                                            const checkHeart2 = setInterval(() => {
                                                if (heart2Completed) {
                                                    clearInterval(checkHeart2);
                                                    if (blessingsSent < totalBlessings) {
                                                        sendRandomBlessing();
                                                    }
                                                }
                                            }, 100);
                                        } else {
                                            if (blessingsSent < totalBlessings) {
                                                sendRandomBlessing();
                                            }
                                        }
                                    }, 100);
                                }
                            }, 100);
                        } else {
                            sendHeart2Blessings();
                        }
                    }, 100);
                }, 100);
            }

            // 添加开始按钮事件
            startBtn.addEventListener('click', startBlessings);

            // 初始消息
            message.textContent = "点击上方按钮开始发送520次心动祝福";
            updateIndicators();

            // 窗口大小变化时重新计算爱心坐标
            window.addEventListener('resize', function() {
                heart1Points.length = 0;
                heart2Points.length = 0;
                heart1Points.push(...generateHeartPoints(99, -120, -80, 0.9));
                heart2Points.push(...generateHeartPoints(99, 120, 80, 0.9));
            });

            // 图片加载失败处理
            const profilePhoto = document.querySelector('.profile-photo');
            profilePhoto.onerror = function() {
                this.src = 'https://via.placeholder.com/280x280/ff99cc/ffffff?text=可爱的段思妃';
                this.alt = '段思妃的照片（默认图片）';
            };

            // 预加载图片
            const img = new Image();
            img.src = 'https://love-for-dsf.github.io/love2.jpg';
        });
    </script>
</body>
</html>
