<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>温馨祝福 - 段思妃</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }

        .header {
            margin-bottom: 40px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            color: #e91e63;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .subtitle {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 20px;
        }

        .instructions {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .tip-window {
            position: fixed;
            width: 250px;
            height: 80px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            border: 2px solid white;
            z-index: 1000;
            animation: floatIn 0.5s ease-out;
            text-align: center;
            padding: 10px;
            cursor: default;
            transition: transform 0.3s ease;
        }

        .tip-window:hover {
            transform: scale(1.05);
            z-index: 1001;
        }

        @keyframes floatIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 90%;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Microsoft YaHei', sans-serif;
        }

        #startBtn {
            background: linear-gradient(135deg, #e91e63, #ff4081);
            color: white;
        }

        #startBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(233, 30, 99, 0.4);
        }

        #stopBtn {
            background: linear-gradient(135deg, #2196F3, #03A9F4);
            color: white;
        }

        #stopBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(33, 150, 243, 0.4);
        }

        #resetBtn {
            background: linear-gradient(135deg, #4CAF50, #8BC34A);
            color: white;
        }

        #resetBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        .counter {
            font-size: 18px;
            color: #333;
            font-weight: bold;
            padding: 10px 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border: 2px solid #e0e0e0;
            min-width: 150px;
        }

        .footer {
            margin-top: 40px;
            color: #777;
            font-size: 14px;
        }

        .heart {
            color: #e91e63;
            animation: heartbeat 1.5s infinite;
            display: inline-block;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .love-tips {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }

        .love-tip {
            background: #fff5f8;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            color: #e91e63;
            border: 1px solid #ffcce0;
        }

        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: center;
            }

            button {
                width: 200px;
            }

            h1 {
                font-size: 2em;
            }

            .love-tips {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💖 温馨祝福 - 520次心动 💖</h1>
            <div class="subtitle">送给特别的段思妃</div>
            <div class="instructions">
                <p>点击"开始祝福"按钮，屏幕上会弹出<strong>520个</strong>温馨祝福窗口</p>
                <p>每个祝福都会随机出现在屏幕的不同位置，3秒后自动消失</p>
            </div>

            <div class="love-tips">
                <div class="love-tip">段思妃要天天开心</div>
                <div class="love-tip">只为生活快乐</div>
                <div class="love-tip">你为什么这么吸引我眼球</div>
                <div class="love-tip">520次心动发送中...</div>
            </div>
        </div>

        <div class="controls">
            <button id="startBtn">✨ 开始祝福 (520个窗口)</button>
            <button id="stopBtn">⏸️ 停止创建</button>
            <button id="resetBtn">🔄 清空所有</button>
            <div class="counter">
                已创建: <span id="count">0</span> / 520
            </div>
        </div>

        <div class="footer">
            <p>每个祝福都带着最真挚的心意 <span class="heart">❤️</span></p>
            <p>99次心动，只因你是段思妃！</p>
        </div>
    </div>

    <script>
        // 修改后的祝福语数组（删除了第6、7、10句，添加了新句子）
        const tips = [
            '段思妃要天天开心',
            '只为生活快乐',
            '愿你笑口常开',
            '每天都有好心情',
            '心想事成万事如意',
            '平安喜乐', // 原来的第8句
            '愿你被世界温柔以待', // 原来的第9句
            '生活充满阳光', // 原来的第10句（已删除，这里是原来的第11句）
            '快乐永相随', // 原来的第12句
            '好运连连', // 原来的第13句
            '前程似锦', // 原来的第14句
            '梦想成真', // 原来的第15句
            '你为什么这么吸引我眼球' // 新添加的句子
        ];

        // 背景颜色数组
        const bgColors = [
            '#FFB6C1', // lightpink
            '#87CEEB', // skyblue
            '#90EE90', // lightgreen
            '#E6E6FA', // lavender
            '#FFFFE0', // lightyellow
            '#DDA0DD', // plum
            '#FF7F50', // coral
            '#FFE4C4', // bisque
            '#7FFFD4', // aquamarine
            '#FFE4E1', // mistyrose
            '#F0FFF0', // honeydew
            '#FFF0F5', // lavenderblush
            '#FDF5E6', // oldlace
            '#FFDAB9', // peachpuff
            '#E0FFFF', // lightcyan
            '#F5DEB3', // wheat
            '#FFC0CB', // pink
            '#D8BFD8', // thistle
            '#98FB98', // palegreen
            '#AFEEEE'  // paleturquoise
        ];

        // 变量声明
        let tipCount = 0;
        let isCreating = false;
        let creationInterval = null;
        const maxTips = 99; // 改为99次
        let createdTips = [];

        // 获取DOM元素
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const resetBtn = document.getElementById('resetBtn');
        const countDisplay = document.getElementById('count');

        // 创建单个祝福窗口
        function createTipWindow() {
            if (tipCount >= maxTips) {
                stopCreating();
                return;
            }

            const tip = document.createElement('div');
            tip.className = 'tip-window';

            // 随机选择祝福语
            const randomTip = tips[Math.floor(Math.random() * tips.length)];
            tip.textContent = randomTip;

            // 随机背景颜色
            const randomColor = bgColors[Math.floor(Math.random() * bgColors.length)];
            tip.style.backgroundColor = randomColor;

            // 随机位置
            const windowWidth = 250;
            const windowHeight = 80;
            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;

            const x = Math.random() * (screenWidth - windowWidth);
            const y = Math.random() * (screenHeight - windowHeight);

            tip.style.left = x + 'px';
            tip.style.top = y + 'px';

            // 随机旋转角度（-5到5度）
            const rotation = Math.random() * 10 - 5;
            tip.style.transform = `rotate(${rotation}deg)`;

            // 添加到页面
            document.body.appendChild(tip);
            createdTips.push(tip);

            // 更新计数
            tipCount++;
            countDisplay.textContent = tipCount;

            // 3秒后淡出并移除
            setTimeout(() => {
                tip.style.animation = 'fadeOut 0.5s ease-out forwards';
                setTimeout(() => {
                    if (tip.parentNode) {
                        tip.parentNode.removeChild(tip);
                        // 从数组中移除
                        const index = createdTips.indexOf(tip);
                        if (index > -1) {
                            createdTips.splice(index, 1);
                        }
                    }
                }, 500);
            }, 3000);
        }

        // 开始创建祝福窗口
        function startCreating() {
            if (isCreating) return;

            isCreating = true;
            tipCount = 0;
            countDisplay.textContent = '0';

            // 先清空现有的
            resetTips();

            startBtn.disabled = true;
            startBtn.innerHTML = '🎁 正在发送520次心动...';
            startBtn.style.opacity = '0.7';

            // 创建99个窗口，间隔100毫秒
            let created = 0;
            creationInterval = setInterval(() => {
                if (created < maxTips) {
                    createTipWindow();
                    created++;
                } else {
                    stopCreating();
                    // 完成提示
                    setTimeout(() => {
                        alert('💝 520次心动已全部发送完成！\n祝段思妃永远快乐！');
                    }, 500);
                }
            }, 100);
        }

        // 停止创建
        function stopCreating() {
            if (creationInterval) {
                clearInterval(creationInterval);
                creationInterval = null;
            }

            isCreating = false;
            startBtn.disabled = false;
            startBtn.innerHTML = '✨ 重新发送 (520个窗口)';
            startBtn.style.opacity = '1';
        }

        // 清空所有祝福窗口
        function resetTips() {
            // 停止创建
            stopCreating();

            // 移除所有窗口
            createdTips.forEach(tip => {
                if (tip.parentNode) {
                    tip.parentNode.removeChild(tip);
                }
            });

            createdTips = [];
            tipCount = 0;
            countDisplay.textContent = '0';
        }

        // 事件监听
        startBtn.addEventListener('click', startCreating);
        stopBtn.addEventListener('click', stopCreating);
        resetBtn.addEventListener('click', resetTips);

        // 页面加载时显示提示
        window.addEventListener('load', () => {
            setTimeout(() => {
                const instruction = document.querySelector('.instructions');
                instruction.style.transform = 'scale(1.02)';
                instruction.style.transition = 'transform 0.3s ease';
                setTimeout(() => {
                    instruction.style.transform = 'scale(1)';
                }, 300);
            }, 1000);
        });

        // 键盘快捷键支持
        document.addEventListener('keydown', (e) => {
            // 空格键开始/停止
            if (e.code === 'Space') {
                e.preventDefault();
                if (isCreating) {
                    stopCreating();
                } else {
                    startCreating();
                }
            }

            // ESC键清空
            if (e.code === 'Escape') {
                resetTips();
            }

            // 数字键1快速开始
            if (e.code === 'Digit1') {
                startCreating();
            }
        });
    </script>
</body>

</html>
